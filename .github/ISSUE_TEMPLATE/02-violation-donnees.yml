name: "Registre des violations de données"
description: "FEMAS HDF – Documenter un incident de sécurité (art. 33.5 RGPD) – à remplir dès la découverte"
title: "[Violation] "
labels: ["violation", "urgent"]
body:
  - type: markdown
    attributes:
      value: |
        ## FEMAS HDF – Registre des violations de données personnelles
        Toute violation (perte, vol, piratage, envoi au mauvais destinataire, accès non autorisé…) doit être **documentée en interne**,
        **notifiée à la CNIL sous 72 h** si elle présente un risque pour les personnes, et **communiquée aux patients** si le risque est élevé.
        ⚠️ Ne saisissez aucune donnée nominative de patient.
  - type: input
    id: structure
    attributes: {label: "Structure concernée"}
    validations: {required: true}
  - type: input
    id: date_decouverte
    attributes: {label: "Date et heure de découverte", placeholder: "JJ/MM/AAAA HH:MM"}
    validations: {required: true}
  - type: dropdown
    id: nature
    attributes:
      label: "Nature de la violation"
      multiple: true
      options: ["Perte de confidentialité (accès / divulgation non autorisés)", "Perte d'intégrité (modification non autorisée)", "Perte de disponibilité (perte, destruction, rançongiciel)"]
    validations: {required: true}
  - type: textarea
    id: description
    attributes: {label: "Circonstances (que s'est-il passé ?)"}
    validations: {required: true}
  - type: input
    id: volume
    attributes: {label: "Nombre approximatif de personnes et d'enregistrements concernés"}
    validations: {required: true}
  - type: checkboxes
    id: donnees
    attributes:
      label: "Données concernées"
      options:
        - label: "Identité / coordonnées"
        - label: "NIR / INS"
        - label: "Données de santé"
        - label: "Données bancaires / facturation"
        - label: "Identifiants de connexion"
  - type: textarea
    id: consequences
    attributes: {label: "Conséquences probables pour les personnes"}
    validations: {required: true}
  - type: textarea
    id: mesures
    attributes: {label: "Mesures prises ou envisagées (pour remédier et limiter les effets)"}
    validations: {required: true}
  - type: dropdown
    id: risque
    attributes:
      label: "Niveau de risque pour les personnes"
      options: ["Aucun risque – documentation interne uniquement", "Risque – notification CNIL sous 72 h", "Risque élevé – notification CNIL + information des personnes"]
    validations: {required: true}
  - type: input
    id: notification_cnil
    attributes: {label: "Notification CNIL (date, n° de dossier) ou justification de l'absence", placeholder: "Ex. : 12/10/2026 – n° …"}
  - type: input
    id: info_personnes
    attributes: {label: "Information des personnes concernées (date, moyen)"}
  - type: input
    id: declarant
    attributes: {label: "Déclarant (nom, fonction)"}
    validations: {required: true}
