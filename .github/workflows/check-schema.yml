name: Vérifier le formulaire généré
on:
  pull_request:
    paths: ["schema/**", "scripts/**", ".github/ISSUE_TEMPLATE/**"]
  push:
    paths: ["schema/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Le formulaire GitHub est-il à jour avec schema/registre.yml ?
        run: |
          python scripts/generate_issue_form.py
          git diff --exit-code .github/ISSUE_TEMPLATE/01-registre-traitement.yml || (echo "::error::Relancez scripts/generate_issue_form.py" && exit 1)
