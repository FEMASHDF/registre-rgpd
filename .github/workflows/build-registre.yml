name: Compiler le registre RGPD
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:
permissions:
  issues: read
  contents: write
concurrency: build-registre
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Générer REGISTRE.md, registre.csv, plan_actions.csv
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/build_registre.py
      - name: Commit
        run: |
          git config user.name "registre-bot"
          git config user.email "registre-bot@users.noreply.github.com"
          git add registre/
          git diff --cached --quiet || git commit -m "Registre RGPD : mise à jour automatique"
          git push
