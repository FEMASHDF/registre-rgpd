name: Compiler le registre RGPD
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  push:
    branches: [main]
    paths: ["schema/**", "scripts/**"]
  workflow_dispatch:
permissions:
  issues: write
  contents: write
concurrency: build-registre
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Créer les labels (utile pour un nouveau dépôt créé depuis le modèle)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh label create registre --color c2241a --description "Fiche du registre RGPD" --force
          gh label create a-valider --color 751e09 --description "Fiche en attente de validation" --force
          gh label create valide --color 2da44e --description "Fiche validée par le référent RGPD" --force
          gh label create archive --color 8c959f --description "Traitement qui n'existe plus" --force
          gh label create violation --color b60205 --description "Violation de données (art. 33)" --force
          gh label create urgent --color d93f0b --description "À traiter sous 72 h" --force
          # Une fiche créée avant l'existence des labels reçoit le label « registre »
          for n in $(gh issue list --state all --limit 2000 --json number,title,labels \
                     --jq '.[] | select((.title|startswith("[Registre]")) and ([.labels[].name]|index("registre")|not)) | .number'); do
            gh issue edit "$n" --add-label registre,a-valider
          done
      - name: Générer REGISTRE.md, registre.xlsx, registre.csv, plan_actions.csv
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/build_registre.py
      - name: Commit
        run: |
          git config user.name "registre-bot"
          git config user.email "registre-bot@users.noreply.github.com"
          git add registre/
          git diff --cached --quiet || git commit -m "Registre RGPD : mise à jour automatique"
          git push
